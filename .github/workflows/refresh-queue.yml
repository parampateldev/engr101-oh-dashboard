name: Refresh queue snapshot

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: queue-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch live queue snapshot
        env:
          EECSOH_COOKIE: ${{ secrets.EECSOH_COOKIE }}
        run: |
          python3 server.py --snapshot

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue-snapshot.json
          git diff --staged --quiet && echo "No queue changes" && exit 0
          git commit -m "Update queue snapshot"
          if ! git pull --rebase --autostash origin main; then
            echo "::error::Failed to rebase onto main before pushing queue snapshot"
            git rebase --abort 2>/dev/null || true
            exit 1
          fi
          git push
