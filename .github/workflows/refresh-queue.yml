name: Refresh queue snapshot

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: queue-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live queue
        run: |
          URL="https://eecsoh.eecs.umich.edu/api/queues/1xHcWfn2KW5HHly5Y3rLA2g5kW2"
          TMP="queue-snapshot.json.tmp"
          ok=0

          for attempt in 1 2 3 4 5; do
            echo "Fetch attempt ${attempt}…"
            if curl --connect-timeout 15 --max-time 40 -fsSL "$URL" -o "$TMP" \
              && python3 -c 'import json,sys; d=json.load(open("queue-snapshot.json.tmp")); assert isinstance(d, dict) and "queue" in d'; then
              mv "$TMP" queue-snapshot.json
              ok=1
              echo "Fetched queue on attempt ${attempt}"
              break
            fi
            rm -f "$TMP"
            sleep $((attempt * 4))
          done

          if [ "$ok" -ne 1 ]; then
            echo "::warning::Could not reach eecsoh after retries; keeping previous snapshot"
          fi

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue-snapshot.json
          git diff --staged --quiet && echo "No queue changes" && exit 0
          git commit -m "Update queue snapshot"
          if ! git pull --rebase --autostash origin main; then
            echo "::error::Failed to rebase onto main before pushing queue snapshot"
            git rebase --abort 2>/dev/null || true
            exit 1
          fi
          git push
