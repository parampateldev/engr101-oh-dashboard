name: Build site config

on:
  push:
    branches: [main]
    paths-ignore:
      - queue-snapshot.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write staff-config.js
        env:
          STAFF_PUBLISH_TOKEN: ${{ secrets.STAFF_PUBLISH_TOKEN }}
        run: |
          cat > staff-config.js <<EOF
          window.STAFF_PUBLISH = {
            repo: "parampateldev/engr101-oh-dashboard",
            token: "${STAFF_PUBLISH_TOKEN}"
          };
          EOF

      - name: Commit config if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staff-config.js
          git diff --staged --quiet && echo "No config changes" && exit 0
          git commit -m "Update staff-config.js"
          git push
